# Poller script mounted into the CronJob. Kept as a ConfigMap so it can be edited without
# rebuilding an image. POSIX sh (runs on alpine).
apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-poller-script
  namespace: awx
data:
  poll.sh: |
    #!/bin/sh
    # Detect open Dynatrace problems (via the in-cluster ActiveGate) and launch the AWX
    # 'remediation' job template over internal DNS. No public exposure of AWX.
    # Dedup uses a marker comment posted back to the Dynatrace problem (idempotent).
    set -eu

    # Ensure tooling (alpine base image is minimal).
    if ! command -v curl >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
        apk add --no-cache curl jq >/dev/null 2>&1
    fi

    DT_TOKEN="$(cat /secrets/dt/apiToken)"
    AWX_PASS="$(cat /secrets/awx/password)"
    AWX_USER="${AWX_USER:-admin}"
    MARKER="[self-healing-poller]"

    : "${DT_API_BASE:?DT_API_BASE not set}"
    : "${AWX_BASE:?AWX_BASE not set}"
    : "${PROBLEM_SELECTOR:?PROBLEM_SELECTOR not set}"
    : "${FROM_WINDOW:?FROM_WINDOW not set}"
    : "${TEMPLATE_NAME:?TEMPLATE_NAME not set}"

    echo "Resolving AWX job template '$TEMPLATE_NAME'..."
    TID="$(curl -sk -u "$AWX_USER:$AWX_PASS" "$AWX_BASE/api/v2/job_templates/?name=$TEMPLATE_NAME" | jq -r '.results[0].id // empty')"
    if [ -z "$TID" ]; then echo "ERROR: job template '$TEMPLATE_NAME' not found in AWX"; exit 1; fi

    echo "Querying open Dynatrace problems (selector=$PROBLEM_SELECTOR, from=$FROM_WINDOW)..."
    RESP="$(curl -sk -H "Authorization: Api-Token $DT_TOKEN" \
        "$DT_API_BASE/v2/problems?from=$FROM_WINDOW&problemSelector=$PROBLEM_SELECTOR&fields=impactedEntities")"

    if ! echo "$RESP" | jq -e '.problems' >/dev/null 2>&1; then
        echo "ERROR: unexpected Dynatrace response: $RESP"; exit 1
    fi

    COUNT="$(echo "$RESP" | jq -r '.totalCount // 0')"
    echo "Found $COUNT open problem(s)."
    [ "$COUNT" -gt 0 ] || { echo "Nothing to do."; exit 0; }

    echo "$RESP" | jq -c '.problems[]' > /tmp/problems.jsonl
    while IFS= read -r prob; do
        PID="$(echo "$prob" | jq -r '.problemId')"

        # Dedup: skip if we already posted our marker comment on this problem.
        COMMENTS="$(curl -sk -H "Authorization: Api-Token $DT_TOKEN" "$DT_API_BASE/v2/problems/$PID/comments?pageSize=100" || echo '{}')"
        if echo "$COMMENTS" | jq -e --arg m "$MARKER" '.comments[]? | select((.content // "") | contains($m))' >/dev/null 2>&1; then
            echo "  $PID already handled - skipping."
            continue
        fi

        # Build a payload compatible with the remediation playbook (state/pid/impactedEntities).
        IMP="$(echo "$prob" | jq -c '[.impactedEntities[]? | {entity: .entityId.id, name: .name}]')"
        EXTRA="$(jq -nc --arg pid "$PID" --argjson imp "$IMP" '{state:"OPEN", pid:$pid, impactedEntities:$imp}')"

        echo "  Launching remediation for $PID..."
        curl -sk -u "$AWX_USER:$AWX_PASS" -H "Content-Type: application/json" \
            -d "{\"extra_vars\": $EXTRA}" "$AWX_BASE/api/v2/job_templates/$TID/launch/" >/dev/null

        # Mark handled by commenting on the problem (also visible in the Dynatrace UI).
        curl -sk -X POST -H "Authorization: Api-Token $DT_TOKEN" -H "Content-Type: application/json" \
            -d "{\"message\":\"$MARKER remediation triggered via in-cluster poller\",\"context\":\"self-healing-poller\"}" \
            "$DT_API_BASE/v2/problems/$PID/comments" >/dev/null || echo "  (warning: could not post marker comment)"
        echo "  Done."
    done < /tmp/problems.jsonl
    echo "Poll complete."
